name: Atualizar Painel Agro Frequencia

on:
  schedule:
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: pip install requests

      - name: Executar Script de Atualizacao
        run: python atualizar_painel.py

      - name: Commit e Push Automatico para o Repositorio
        run: |
          git config --global user.name "Robo Agro Frequencia"
          git config --global user.email "robo@agrofrequencia.com"
          git add painel-agro.html
          git commit -m "Atualizacao automatica do Painel de Mercado via Python" || echo "Sem alteracoes para commitar"
          git push
